<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alborá - Your Bag</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --nav-bg: #191613;
            --text-light: #E8DECB;
            --gold: #C5A253;
            --section-bg: #0F0D0B;
            --border: #3D3733;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--section-bg);
            color: var(--text-light);
            font-family: 'Jost', sans-serif;
            min-height: 100vh;
            padding-bottom: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-family: 'Bodoni Moda', serif;
            font-size: 22px;
            font-weight: 400;
        }
        .close-btn {
            background: none; border: none; color: var(--text-light);
            font-size: 22px; cursor: pointer; text-decoration: none;
        }
        .cart-container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .cart-title { font-family: 'Bodoni Moda', serif; font-size: 32px; margin-bottom: 20px; }
        
        .cart-item {
            display: flex; align-items: center; gap: 20px;
            padding: 20px; border: 1px solid var(--border);
            border-radius: 8px; margin-bottom: 15px;
            background: rgba(255,255,255,0.02);
        }
        .cart-item-art {
            width: 80px; height: 100px;
            background: linear-gradient(180deg, #3D3620 0%, #2A2516 100%);
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; flex-shrink: 0;
        }
        .cart-item-art svg { width: 50px; height: 60px; }
        .cart-item-info { flex: 1; }
        .cart-item-info h3 { font-size: 15px; font-weight: 500; margin-bottom: 5px; }
        .cart-item-cat { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); margin-bottom: 8px; }
        .cart-item-price { font-size: 15px; color: var(--text-light); }
        
        .cart-qty { display: flex; align-items: center; gap: 10px; }
        .cart-qty button {
            width: 28px; height: 28px; background: transparent; border: 1px solid var(--border);
            color: var(--text-light); border-radius: 50%; cursor: pointer; font-size: 14px;
        }
        .cart-qty button:hover { border-color: var(--gold); color: var(--gold); }
        .remove-btn { background: none; border: none; color: #888; font-size: 18px; cursor: pointer; padding: 5px; }
        .remove-btn:hover { color: #d9534f; }

        .cart-summary {
            margin-top: 30px; padding: 25px; border: 1px solid var(--border);
            border-radius: 8px; background: rgba(255,255,255,0.02);
        }
        .summary-row {
            display: flex; justify-content: space-between; margin-bottom: 12px;
            font-size: 14px; color: #A0988A;
        }
        .summary-row.total {
            border-top: 1px solid var(--border); padding-top: 15px; margin-top: 15px;
            font-size: 20px; color: var(--gold); font-weight: 500;
        }
        .checkout-btn {
            width: 100%; margin-top: 20px; background: var(--gold); color: var(--nav-bg);
            border: none; padding: 16px; font-size: 12px; text-transform: uppercase;
            letter-spacing: 2px; font-weight: 500; cursor: pointer; border-radius: 4px;
        }
        .checkout-btn:hover { background: #a98b3f; }
        @media (max-width: 600px) {
            .cart-item { flex-wrap: wrap; }
            .cart-item-info { flex: 1 1 100%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Alborá &middot; Your Bag</h1>
        <a href="home.html" class="close-btn">✖</a>
    </div>

    <div class="cart-container">
        <h2 class="cart-title">Your Bag</h2>
        <div id="cartContent"></div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('alboraCart')) || [];

        function saveCart() {
            localStorage.setItem('alboraCart', JSON.stringify(cart));
        }

        function renderCart() {
            const container = document.getElementById('cartContent');

            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding:40px; color:#888;">Your bag is empty.</p>`;
                return;
            }

            let itemsHTML = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                let safePrice = Number(item.price) || 0;
                let safeQty = Number(item.qty) || 1;
                let safeCat = item.category || 'Item';
                
                subtotal += safePrice * safeQty;

                itemsHTML += `
                    <div class="cart-item">
                        <div class="cart-item-art">${item.image || ''}</div>
                        <div class="cart-item-info">
                            <div class="cart-item-cat">${safeCat}</div>
                            <h3>${item.name}</h3>
                            <div class="cart-item-price">₱${safePrice.toLocaleString()}</div>
                        </div>
                        <div class="cart-qty">
                            <button onclick="changeQty(${index}, -1)">−</button>
                            <span>${safeQty}</span>
                            <button onclick="changeQty(${index}, 1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${index})">✖</button>
                    </div>
                `;
            });

            container.innerHTML = `
                ${itemsHTML}
                <div class="cart-summary">
                    <div class="summary-row"><span>Subtotal</span><span>₱${subtotal.toLocaleString()}</span></div>
                    <div class="summary-row"><span>Shipping</span><span>${subtotal >= 2000 ? 'FREE' : '₱150'}</span></div>
                    <div class="summary-row total">
                        <span>Total</span><span>₱${(subtotal + (subtotal >= 2000 ? 0 : 150)).toLocaleString()}</span>
                    </div>
                    <button class="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
                </div>
            `;
        }

        function changeQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            saveCart();
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
            renderCart();
        }

        renderCart();
            function proceedToCheckout() {
            // 1. I-check kung may laman yung cart
            let cart = JSON.parse(localStorage.getItem('alboraCart')) || [];
            if (cart.length === 0) {
                alert("Your bag is empty!");
                return;
            }

            // 2. I-check kung naka-login na ba (may 'alboraUser' ba sa localStorage?)
            let currentUser = localStorage.getItem('alboraUser');

            if (currentUser) {
                // Kung naka-login na, diretso checkout
                window.location.href = 'checkout.html';
            } else {
                // Kung hindi pa, ipadala sa login page
                alert("Please log in or create an account to proceed to checkout.");
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
